<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LR(1) Parser Engine</title>
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #09090b;
            --bg-surface: rgba(24, 24, 27, 0.6);
            --bg-surface-hover: rgba(39, 39, 42, 0.8);
            --border-light: rgba(255, 255, 255, 0.08);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent-primary: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --accent-secondary: #8b5cf6;
            --font-sans: 'Outfit', system-ui, sans-serif;
            --font-mono: 'Fira Code', monospace;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.08) 0%, transparent 50%);
            color: var(--text-main);
            font-family: var(--font-sans);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- CUSTOM SCROLLBARS --- */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { 
            background: rgba(255, 255, 255, 0.1); 
            border-radius: 4px; 
        }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

        /* --- HEADER --- */
        header {
            padding: 20px 40px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-light);
            background: rgba(9, 9, 11, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 10;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1::before {
            content: '';
            display: inline-block;
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 6px;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* --- MAIN LAYOUT --- */
        .container {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
            min-height: 0; /* Important for flex child scrolling */
        }

        /* --- PANELS --- */
        .panel {
            background: var(--bg-surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .left-panel {
            flex: 0 0 350px;
            padding: 24px;
        }

        .right-panel {
            flex: 1;
            padding: 24px 24px 0 24px;
        }

        /* --- FORM ELEMENTS --- */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
            flex: 1;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        textarea {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #d4d4d8;
            font-family: var(--font-mono);
            font-size: 13px;
            line-height: 1.6;
            padding: 16px;
            border-radius: 12px;
            flex: 1;
            resize: none;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        textarea:focus {
            border-color: var(--accent-primary);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2), 0 0 0 1px var(--accent-primary);
            background: rgba(0, 0, 0, 0.5);
        }

        button {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-family: var(--font-sans);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.2), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
        }

        button:hover::after {
            transform: translateX(100%);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
        }

        /* --- TABS --- */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 12px;
            overflow-x: auto;
        }

        .tab {
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            font-weight: 500;
            color: var(--text-muted);
            font-size: 0.9rem;
            white-space: nowrap;
            background: transparent;
            border: 1px solid transparent;
        }

        .tab:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.03);
        }

        .tab.active {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border-color: var(--border-light);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .tab-content {
            display: none;
            flex: 1;
            overflow-y: auto;
            font-family: var(--font-mono);
            font-size: 13px;
            white-space: pre-wrap;
            line-height: 1.6;
            color: #d4d4d8;
            padding-bottom: 24px;
        }

        .tab-content.active {
            display: block;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- TABLES --- */
        .table-container {
            width: 100%;
            border-radius: 12px;
            border: 1px solid var(--border-light);
            background: rgba(0, 0, 0, 0.2);
            overflow: auto;
        }

        table {
            width: max-content;
            min-width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-light);
            border-right: 1px solid var(--border-light);
        }

        th {
            background: rgba(24, 24, 27, 0.95) !important;
            backdrop-filter: blur(8px);
            color: var(--text-muted);
            font-family: var(--font-sans);
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: sticky;
            top: 0;
            z-index: 20;
            border-bottom: 1px solid rgba(255,255,255,0.1) !important;
        }

        td:first-child, th:first-child {
            position: sticky;
            left: 0;
            background: rgba(24, 24, 27, 0.95) !important;
            z-index: 25;
            border-right: 1px solid rgba(255,255,255,0.1) !important;
        }

        th:first-child { z-index: 30; }

        /* Row hover effect */
        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .act-shift { color: #38bdf8; }
        .act-reduce { color: #c084fc; }
        .act-acc { color: #34d399; }
        .divider-col { border-right: 2px solid rgba(255,255,255,0.1) !important; }

        /* --- TABLE CONFIG OVERRIDES --- */
        #tab-tables td, #tab-tables th {
            white-space: nowrap !important;
            max-width: none !important;
        }

        #tab-sim td:first-child, #tab-sim th:first-child {
            position: static !important;
            background: transparent !important;
            z-index: auto;
            border-right: 1px solid var(--border-light) !important;
        }

        #tab-sim table {
            width: 100% !important;
            max-width: 100% !important;
            table-layout: fixed;
        }

        #tab-sim th, #tab-sim td {
            white-space: pre-wrap !important;
            word-break: break-word !important;
            padding: 12px 16px;
        }

        #tab-sim th:nth-child(1), #tab-sim td:nth-child(1) { width: 45%; text-align: left; }
        #tab-sim th:nth-child(2), #tab-sim td:nth-child(2) { width: 35%; text-align: left; }
        #tab-sim th:nth-child(3), #tab-sim td:nth-child(3) { width: 20%; text-align: center; }

        /* --- DFA STATE CARDS --- */
        .state-cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        .state-card {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .state-card:hover {
            border-color: rgba(255,255,255,0.2);
            background: rgba(0, 0, 0, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }

        .state-header {
            color: var(--text-main);
            font-family: var(--font-sans);
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-list {
            margin-bottom: 16px;
            color: #a1a1aa;
        }

        .item-list div { margin-bottom: 4px; }

        .transition-list {
            border-top: 1px solid var(--border-light);
            padding-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: auto;
        }

        .tag {
            background: rgba(255, 255, 255, 0.05);
            color: #e4e4e7;
            padding: 4px 10px;
            border-radius: 6px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            border: 1px solid var(--border-light);
        }

        /* --- CODE VIEW --- */
        .code-view {
            background: #000;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-light);
            color: #d4d4d8;
        }

        .conflict-text {
            color: #fb923c;
            border-left: 3px solid #fb923c;
            padding: 12px 16px;
            margin: 16px 0;
            background: rgba(251, 146, 60, 0.1);
            border-radius: 0 8px 8px 0;
            font-family: var(--font-sans);
        }

        .loading {
            display: none;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 12px;
            font-family: var(--font-sans);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            font-family: var(--font-sans);
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <header>
        <h1>Parser Engine</h1>
    </header>

    <div class="container">
        <!-- LEFT PANEL -->
        <div class="panel left-panel">
            <div class="input-group" style="flex: 2;">
                <label>Grammar Configuration</label>
                <textarea id="grammarInput" spellcheck="false">{{ grammar }}</textarea>
            </div>
            
            <div class="input-group" style="flex: 1;">
                <label>Test Parse String</label>
                <textarea id="parseInput" spellcheck="false">{{ initial_input }}</textarea>
            </div>

            <button id="runBtn" onclick="runParser()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                Compile & Parse
            </button>
            <div id="loading" class="loading">Processing Pipeline...</div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="panel right-panel">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('tab-summary')">Diagnostics</div>
                <div class="tab" onclick="switchTab('tab-dfa')">Automaton</div>
                <div class="tab" onclick="switchTab('tab-tables')">Parse Tables</div>
                <div class="tab" onclick="switchTab('tab-sim')">Simulation</div>
                <div class="tab" onclick="switchTab('tab-tree')">AST / Derivation</div>
                <div class="tab" onclick="switchTab('tab-input-grammar')">Source</div>
                <div class="tab" onclick="switchTab('tab-rules')">Rules</div>
            </div>

            <div id="tab-summary" class="tab-content active">
                <div class="empty-state">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:16px"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                    <div>Enter a grammar and hit Parse to view diagnostics.</div>
                </div>
            </div>
            <div id="tab-input-grammar" class="tab-content"><div class="code-view" id="view-grammar"></div></div>
            <div id="tab-rules" class="tab-content">Pending...</div>
            <div id="tab-dfa" class="tab-content">Pending...</div>
            <div id="tab-tables" class="tab-content">Pending...</div>
            <div id="tab-sim" class="tab-content">Pending...</div>
            <div id="tab-tree" class="tab-content" style="text-align: center; overflow: auto;">Pending...</div>
        </div>
    </div>

    <!-- Inject Mermaid -->
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ startOnLoad: false, theme: 'dark' });
        window.mermaid = mermaid;
    </script>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            
            if (event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            } else {
                let targetTab = document.querySelector(`[onclick="switchTab('${tabId}')"]`);
                if(targetTab) targetTab.classList.add('active');
            }
            
            const targetEl = document.getElementById(tabId);
            targetEl.classList.add('active');

            if (tabId === 'tab-tree' && window.lastTreeCode) {
                const treeDiv = document.getElementById('tab-tree');
                treeDiv.innerHTML = `<pre class="mermaid">${window.lastTreeCode}</pre>`;
                if (window.mermaid) {
                    window.mermaid.run({ nodes: treeDiv.querySelectorAll('.mermaid') });
                }
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTable(raw, isAction=false) {
            if (!raw) return 'N/A';
            let lines = raw.trim().split('\n');
            let html = '<div class="table-container"><table>';
            lines.forEach((line, index) => {
                if (line.includes('----')) return;
                
                let segments = line.split('|||');
                let leftCols = segments[0].split('\t');
                
                html += '<tr>';
                
                leftCols.forEach((col, cIdx) => {
                    let text = col.trim();
                    let escapedText = escapeHtml(text);
                    let isDivider = (cIdx === leftCols.length - 1 && segments.length > 1);
                    let className = isDivider ? 'divider-col ' : '';
                    
                    if (index === 0) {
                        html += `<th class="${className}">${escapedText}</th>`;
                    } else {
                        if (isAction) {
                            if (text.startsWith('S') || text.startsWith('shift')) className += 'act-shift';
                            else if (text.startsWith('R') || text.startsWith('reduce')) className += 'act-reduce';
                            else if (text.startsWith('ACC') || text.startsWith('accept')) className += 'act-acc';
                        }
                        html += `<td class="${className}">${escapedText}</td>`;
                    }
                });
                
                let rightCols = segments.length > 1 ? segments[1].split('\t').slice(1) : [];
                rightCols.forEach(col => {
                    let text = col.trim();
                    if (index === 0) html += `<th>${escapeHtml(text)}</th>`;
                    else html += `<td>${escapeHtml(text)}</td>`;
                });
                
                html += '</tr>';
            });
            html += '</table></div>';
            return html;
        }

        function formatDFA(raw) {
            if (!raw) return 'N/A';
            const states = raw.split(/^I(\d+):/m);
            let html = '<div class="state-cards-container">';
            
            for(let i = 1; i < states.length; i += 2) {
                let stateNum = states[i];
                let content = states[i+1].trim();
                let lines = content.split('\n');
                
                let items = [];
                let transitions = [];
                
                lines.forEach(l => {
                    let text = l.trim();
                    if(text.startsWith('goto')) {
                        // Strip 'I' prefix from transitions (e.g., goto(id) -> I1 to goto(id) -> 1)
                        text = text.replace(/->\s*I(\d+)/g, '-> $1');
                        transitions.push(text);
                    }
                    else if(text && text !== '(No transitions)') items.push(text);
                });

                html += `
                <div class="state-card">
                    <div class="state-header">State ${stateNum} <span class="tag">#${stateNum}</span></div>
                    <div class="item-list">
                        ${items.map(item => `<div>${escapeHtml(item)}</div>`).join('')}
                    </div>
                    <div class="transition-list">
                        ${transitions.length > 0 ? 
                            transitions.map(tr => `<span class="tag">${escapeHtml(tr)}</span>`).join('') : 
                            '<span style="color: #64748b; font-size: 11px;">(Terminal)</span>'}
                    </div>
                </div>`;
            }
            html += '</div>';
            return html;
        }

        async function runParser() {
            const btn = document.getElementById('runBtn');
            const loading = document.getElementById('loading');
            
            btn.style.display = 'none';
            loading.style.display = 'block';

            const grammarText = document.getElementById('grammarInput').value;
            const parseString = document.getElementById('parseInput').value;

            document.getElementById('view-grammar').innerText = grammarText + '\n\n-- Test String --\n' + parseString;

            try {
                const response = await fetch('/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ grammar: grammarText, input_string: parseString })
                });

                const data = await response.json();

                if (data.error) {
                    document.getElementById('tab-summary').innerHTML = `<div class="conflict-text" style="color:#ef4444; border-color:#ef4444; background: rgba(239, 68, 68, 0.1)">${escapeHtml(data.error)}</div>`;
                    switchTab('tab-summary');
                } else {
                    let summaryHtml = data.sections['summary'] || '';
                    summaryHtml = summaryHtml.replace(/(Conflict.*?precedence!)/g, '<div class="conflict-text">$1</div>');
                    
                    document.getElementById('tab-summary').innerHTML = '<h3 style="font-family:var(--font-sans); margin-top:0;">Sets & Diagnostics</h3>' + summaryHtml;
                    document.getElementById('tab-rules').innerHTML = '<h3 style="font-family:var(--font-sans); margin-top:0;">Numbered Rules</h3>' + data.sections['NUMBERED PRODUCTION RULES'].split('\n').map(r => `<div>${escapeHtml(r)}</div>`).join('');
                    
                    document.getElementById('tab-dfa').innerHTML = formatDFA(data.sections['DFA ITEMS AND TRANSITIONS']);
                    document.getElementById('tab-tables').innerHTML = formatTable(data.sections['ACTION AND GOTO TABLES'], true);
                    document.getElementById('tab-sim').innerHTML = formatTable(data.sections['PARSER SIMULATION'], true);
                    
                    if (data.sections['DERIVATION TREE']) {
                        window.lastTreeCode = data.sections['DERIVATION TREE'];
                        let treeDiv = document.getElementById('tab-tree');
                        treeDiv.innerHTML = `<pre class="mermaid">${window.lastTreeCode}</pre>`;
                        
                        if (document.getElementById('tab-tree').classList.contains('active')) {
                            if (window.mermaid) {
                                await window.mermaid.run({ nodes: treeDiv.querySelectorAll('.mermaid') });
                            }
                        }
                    } else {
                        window.lastTreeCode = null;
                        document.getElementById('tab-tree').innerText = 'N/A';
                    }
                }
            } catch(e) {
                document.getElementById('tab-summary').innerHTML = `<div class="conflict-text" style="color:#ef4444; border-color:#ef4444; background: rgba(239, 68, 68, 0.1)">Server Error: ${e.message}</div>`;
            } finally {
                btn.style.display = 'flex';
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
